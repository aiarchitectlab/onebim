name: Build Windows

# OneBIM's Windows desktop app (NSIS installer and a portable zip), built on
# GitHub's Windows runner: run it by hand (Actions → Build Windows → Run
# workflow) or push a tag v*. On a tag the installer and the zip are also
# attached to that tag's GitHub release. Both are unsigned (Authenticode):
# Windows SmartScreen asks "Run anyway" on first start.

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product (products/<id>.json)
        default: onebim
      ref:
        description: Commit, tag or branch to build (the branch run from if empty)
        required: false
      release:
        description: Publish as this release, e.g. v0.1.0 (its notes from .github/release-notes/<release>.md); empty, no release
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      PRODUCT: ${{ inputs.product || 'onebim' }}
    steps:
      # The whole history: the version is 0.1.<commit count> (scripts/build-product.mjs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # manifoldc.dll (the booleans) is kept in the repo: engine/native/win-x64.
      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      # The tests run on Linux in CI (ci.yml); two of them read files with Unix line endings and fail on Windows.
      # PowerShell, so the zips are unpacked by Windows' own tar (Git Bash's GNU tar reads C:\ as a host).
      # A release (v0.2.0) gives its number to the app and its files (0.2.0); a plain run keeps 0.1.<commit count>.
      - run: |
          $release = '${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}'
          if ($release -match '^v?(\d+\.\d+\.\d+)$') { $env:LAPIN_VERSION = $Matches[1] }
          pnpm build:product ${{ env.PRODUCT }}
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-windows-x64
          path: |
            build/${{ env.PRODUCT }}/bundle/nsis/*-setup.exe
            build/${{ env.PRODUCT }}/bundle/nsis/*-portable.zip
          if-no-files-found: error
      # Built again for a release that has files already (another version number): those are taken off first.
      - name: Take off the release's old files
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          $new = Get-ChildItem build/${{ env.PRODUCT }}/bundle/nsis -File | Where-Object { $_.Name -like '*-setup.exe' -or $_.Name -like '*-portable.zip' } | ForEach-Object Name
          $old = gh release view $env:TAG -R ${{ github.repository }} --json assets -q '.assets[].name' 2>$null
          foreach ($a in $old) { if ($a -and $new -notcontains $a) { gh release delete-asset $env:TAG $a -R ${{ github.repository }} -y } }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: ${{ format('OneBIM {0}', inputs.release || github.ref_name) }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ hashFiles(format('.github/release-notes/{0}.md', inputs.release || github.ref_name)) != '' && format('.github/release-notes/{0}.md', inputs.release || github.ref_name) || '' }}
          files: |
            build/${{ env.PRODUCT }}/bundle/nsis/*-setup.exe
            build/${{ env.PRODUCT }}/bundle/nsis/*-portable.zip
